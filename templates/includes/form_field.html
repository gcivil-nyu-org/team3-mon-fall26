<div class="field{% if field.errors %} field--error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  <div class="input-wrap input-wrap--{{ field.widget_type }}">{{ field }}</div>
  {% for error in field.errors %}
    <p class="field-error">{{ error }}</p>
  {% endfor %}
  {% if field.help_text %}
    <div class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>
  {% endif %}
</div>
