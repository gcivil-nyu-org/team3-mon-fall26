<article class="park-review">
  <header class="park-review-header">
    <a href="{% url 'public_profile' username=review.user.username %}">@{{ review.user.username }}</a>
    <span class="park-review-rating">{{ review.rating }} / 5 stars</span>
    <time datetime="{{ review.created_at|date:'c' }}">{{ review.created_at|date:"M j, Y" }}</time>
  </header>
  <p class="park-review-body">{{ review.body|linebreaksbr }}</p>
</article>
